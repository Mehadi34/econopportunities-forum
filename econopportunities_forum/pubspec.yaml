name: econopportunities_forum
description: Econopportunities Forum Club App - A comprehensive platform for club management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.8.0

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^12.1.3

  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  lottie: ^2.7.0
  badges: ^3.1.2
  fl_chart: ^0.65.0
  table_calendar: ^3.0.9
  timeago: ^3.6.0
  intl: ^0.18.1

  # Form & Validation
  flutter_form_builder: ^9.2.1
  form_builder_validators: ^9.1.0

  # Image & File
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  image_cropper: ^5.0.1
  photo_view: ^0.14.0
  flutter_pdfview: ^1.3.2

  # Network
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Notifications
  flutter_local_notifications: ^16.3.0

  # Utils
  uuid: ^4.2.2
  path_provider: ^2.1.2
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  permission_handler: ^11.3.0
  device_info_plus: ^9.1.2
  package_info_plus: ^5.0.1
  open_filex: ^4.3.4
  rxdart: ^0.27.7
  equatable: ^2.0.5
  json_annotation: ^4.8.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
